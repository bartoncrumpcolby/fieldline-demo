<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Look comparison | FieldLine</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Barlow",-apple-system,system-ui,sans-serif; background:#0d1118;
    color:#e9ecf3; height:100vh; display:flex; flex-direction:column; }
  .bar { flex:none; padding:12px 18px; border-bottom:1px solid #232833;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .bar h1 { font-family:"Archivo",sans-serif; font-size:14px; font-weight:800;
    letter-spacing:-.01em; margin-right:6px; }
  .hint { font-size:12.5px; color:#7d8698; margin-left:auto; }
  button { font-family:"Archivo",sans-serif; font-size:12.5px; font-weight:700;
    padding:9px 15px; cursor:pointer; color:#e9ecf3; background:transparent;
    border:1px solid #333a48; border-radius:999px; display:flex;
    align-items:center; gap:8px; }
  button:hover { border-color:#68738a; }
  button.on { border-color:#e9ecf3; background:#1a1f2a; }
  .sw { width:12px; height:12px; border-radius:50%; display:inline-block; }
  .stage { flex:1; display:flex; min-height:0; }
  .col { flex:1; display:flex; flex-direction:column; min-width:0;
    border-right:1px solid #232833; }
  .col:last-child { border-right:0; }
  .lab { flex:none; font-family:"Archivo",sans-serif; font-size:11px; font-weight:800;
    letter-spacing:.13em; text-transform:uppercase; color:#8f98ab;
    padding:8px 14px; background:#12161f; }
  iframe { flex:1; width:100%; border:0; background:#fff; }
  body.single .col.b { display:none; }
</style>
</head>
<body class="split">

<div class="bar">
  <h1>Which look?</h1>
  <button id="bSplit" class="on">Side by side</button>
  <button id="bLyfta"><span class="sw" style="background:#16233e"></span>Lyfta only</button>
  <button id="bAuton"><span class="sw" style="background:#04198c"></span>Autonomously only</button>
  <span class="hint">Both are the real site. Scroll inside either one.</span>
</div>

<div class="stage">
  <div class="col a">
    <div class="lab" id="labA">Lyfta &middot; live now</div>
    <iframe id="fa" src="/"></iframe>
  </div>
  <div class="col b">
    <div class="lab">Autonomously</div>
    <iframe id="fb" src="/?look=auton"></iframe>
  </div>
</div>

<script>
  // The auton look is a stylesheet the page pulls in when ?look=auton is set,
  // so both frames are genuinely the live site rather than a mockup of it.
  const body = document.body;
  const fa = document.getElementById("fa"), labA = document.getElementById("labA");
  const btns = {};
  ["bSplit", "bLyfta", "bAuton"].forEach(id => btns[id] = document.getElementById(id));

  function setOn(id) {
    Object.values(btns).forEach(b => b.classList.remove("on"));
    btns[id].classList.add("on");
  }
  btns.bSplit.onclick = () => {
    body.className = "split"; setOn("bSplit");
    fa.src = "/"; labA.innerHTML = "Lyfta &middot; live now";
  };
  btns.bLyfta.onclick = () => {
    body.className = "single"; setOn("bLyfta");
    fa.src = "/"; labA.innerHTML = "Lyfta &middot; live now";
  };
  btns.bAuton.onclick = () => {
    body.className = "single"; setOn("bAuton");
    fa.src = "/?look=auton"; labA.textContent = "Autonomously";
  };
</script>

</body>
</html>
